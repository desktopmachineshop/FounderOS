# GitHub rents a clean machine, installs this project on it, and runs the test
# suite, the type checker, and a production build. A red X means something
# broke. It never deploys and it has no access to secrets.
#
# ## Why runs look sparse
#
# Almost every commit here is pushed by the Claude GitHub App rather than by a
# person. GitHub does not create a workflow run for `push` or `pull_request`
# events generated by that token class — `workflow_dispatch` and
# `repository_dispatch` are the documented exceptions, and they are the only
# triggers below that fire for a bot-authored change.
#
# That is a property of who pushed, not of this file: the same push from a
# human account (or from the web UI) triggers normally. So the triggers below
# are all correct and all kept — they work for human contributors — and for
# bot-authored branches CI is dispatched explicitly instead:
#
#     gh workflow run ci.yml --ref <branch>
#
# See the CI note in CLAUDE.md. The nightly run exists because pushes to main
# are suppressed the same way: without it, main would have no automatic
# verification at all.
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 04:17 UTC daily — an odd minute to avoid the on-the-hour stampede.
    - cron: '17 4 * * *'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Node 22: 18 breaks on a regex this app uses, and 24 has no prebuilt
      # better-sqlite3, which makes installs slow and brittle.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Types
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
